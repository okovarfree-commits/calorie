<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Macros</title>
<style>
/* One-column mobile app: day summary on top, meal cards below, tab bar fixed at the bottom. */
:root{--bg:#f3f5f1;--card:#fff;--text:#1b211c;--muted:#667067;--line:#e1e6df;--accent:#2f8a4c;--on-accent:#fff;--p:#2f6fd6;--c:#c98a0b;--f:#d2453a;--danger:#c7362b;--danger-bg:#fbe9e7;--ok-bg:#dcefe0;--bad-bg:#f9dcd8;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121512;--card:#1b201c;--text:#e9eee8;--muted:#98a397;--line:#2c332d;--accent:#4fb56d;--on-accent:#0d1a10;--p:#6ea1f0;--c:#e4ad3c;--f:#f07a6f;--danger:#f07a6f;--danger-bg:#3a1c19;--ok-bg:#1d3a25;--bad-bg:#43211d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121512;--card:#1b201c;--text:#e9eee8;--muted:#98a397;--line:#2c332d;--accent:#4fb56d;--on-accent:#0d1a10;--p:#6ea1f0;--c:#e4ad3c;--f:#f07a6f;--danger:#f07a6f;--danger-bg:#3a1c19;--ok-bg:#1d3a25;--bad-bg:#43211d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:0 16px 12px}
.top{max-width:640px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;letter-spacing:.01em}
.me{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%}
.me.on{border-color:var(--accent);color:var(--accent)}
.me svg{width:20px;height:20px}
.navcard{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;font-size:1.3rem}
.navcard b{font-size:1rem}.navcard .muted{font-size:.85rem}
.sync{max-width:640px;margin:8px auto 0;padding:8px 12px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:.9rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:8px 0}h3{margin:0 0 6px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
.muted{color:var(--muted);font-size:.85rem}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:.85rem}
input,select{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;border-radius:0;padding:14px 2px;background:none;font-size:.92rem}
.stepper{display:flex;align-items:center;gap:4px}.stepper input{width:52px;text-align:center;padding:6px}
.check{display:flex;align-items:center;gap:10px;margin:0;padding:10px 0;color:var(--text);font-size:1rem;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.check.done .what{text-decoration:line-through;color:var(--muted)}
.check .what{flex:1;min-width:0}
nav button.on{color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:2rem;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(94vw,520px);padding:16px;max-height:90vh}
dialog::backdrop{background:rgb(0 0 0 / .5)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.prop{margin:0;border-color:var(--accent)}
.prop .item>span{white-space:nowrap}
.pick{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pick input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.pick-name{flex:1;min-width:0}.pick-name .muted{font-size:.75rem}
.pick-amt{width:58px;flex:none;padding:6px;text-align:right}
.pick-unit{font-size:.85rem;color:var(--muted);width:3.6em;flex:none;overflow:hidden;text-overflow:ellipsis}
.pick-kcal{font-size:.8rem;min-width:4.2em;text-align:right;flex:none;white-space:nowrap}
.pick.off .pick-name,.pick.off .pick-amt,.pick.off .pick-unit{opacity:.45}
.pick.off .pick-name div:first-child{text-decoration:line-through}
.pick-title{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding:4px 0}
.pick-title:focus{border-color:var(--line);background:var(--bg);padding:4px 8px}
.pick-sep{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:12px 0 2px}
.pick-meta{display:flex;flex-direction:column;gap:8px;margin-top:12px}
label.inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0;color:var(--text);font-size:.95rem}
label.inline input:not([type=checkbox]){width:60px;padding:6px;text-align:center}
label.inline input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
label.inline select{width:auto;padding:6px}
.ok{color:var(--accent);font-weight:600;margin:10px 0 0}
.row.wrap{flex-wrap:wrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal .wd{font-size:.75rem;color:var(--muted);text-align:center}
.cal button{padding:0;aspect-ratio:1;max-width:100%;border-radius:8px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal button small{font-size:.62rem;color:var(--muted)}
.cal .hit{background:var(--ok-bg);border-color:var(--accent);color:var(--text)}
.cal .miss{background:var(--bad-bg);border-color:var(--danger);color:var(--text)}
.cal .future{opacity:.4}
.cal .sel{outline:2px solid var(--text);outline-offset:1px}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:4px}
.pill.hit{background:var(--ok-bg);color:var(--accent)}.pill.miss{background:var(--bad-bg);color:var(--danger)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tag-cal{color:var(--f)}.tag-protein{color:var(--p)}.tag-carb{color:var(--c)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical}
.dot-p{color:var(--p)}.dot-c{color:var(--c)}.dot-f{color:var(--f)}
</style>
</head>
<body>
<header id="top" class="top"></header>
<p id="sync" class="sync" role="status" hidden></p>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>

<script>
"use strict";
const KEY = "calorie-tracker-v1";
// "Snack" is kept as the stored key so older entries still show up; it's labelled "Other food".
const MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
const mealName = m => m === "Snack" ? "Other food" : m;
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r = (n, d = 0) => (Math.round(n * 10 ** d) / 10 ** d).toString();
const num = v => Math.max(0, parseFloat(String(v).replace(",", ".")) || 0);

let state = load();
let ui = { tab: "today", date: today() };

// Shopping: portions planned per recipe, ticked items, and extra free-text items.
// Food preferences the assistant uses for meal ideas.
function emptyPrefs() { return { likes: [], style: [], likeText: "", avoid: "" }; }
const PREF_LIKES = ["Chicken", "Beef", "Pork", "Fish", "Eggs", "Pasta", "Rice", "Potatoes", "Wraps", "Oats", "Italian", "Mexican", "Asian", "Czech", "Spicy", "Sweet breakfasts"];
const PREF_STYLE = ["Quick (under 20 min)", "Meal prep in big batches", "Cheap", "Few dishes to wash", "Lots of protein"];
function emptyShop() { return { plan: {}, checked: {}, extra: [] }; }
function load() {
  const def = { ingredients: [], recipes: [], log: {}, goals: { kcal: 2000, p: 150, c: 200, f: 65 }, shop: emptyShop(), prefs: emptyPrefs() };
  try { const st = Object.assign(def, JSON.parse(localStorage.getItem(KEY)) || {}); st.prefs = { ...emptyPrefs(), ...st.prefs }; return st; } catch { return def; }
}

// ---------- storage ----------
// Inside claude.ai the data lives in the artifact's database (synced across devices):
// "app/settings" holds goals, ingredients and recipes; "days/<date>" holds one day's log.
// Opened as a plain file it falls back to this browser's localStorage.
let db = null;
const synced = {}, chains = {}, loadedDays = new Set();
// Key-order-independent JSON, so a document read back from the store compares equal to what we wrote.
const canon = v => Array.isArray(v) ? `[${v.map(canon).join(",")}]` : v && typeof v === "object" ? `{${Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",")}}` : JSON.stringify(v);
const settingsBody = () => ({ goals: state.goals, ingredients: state.ingredients, recipes: state.recipes, prefs: state.prefs });
function put(path, body) {
  const js = canon(body); if (synced[path] === js) return; synced[path] = js;
  syncStatus(1); busy[path] = (busy[path] || 0) + 1;
  chains[path] = (chains[path] || Promise.resolve()).then(() => db.doc(path).set(body))
    .then(() => syncStatus(-1), e => { delete synced[path]; syncStatus(-1, e); })
    .finally(() => busy[path]--);
}
let pending = 0, syncErr = "";
function syncStatus(d, e) {
  pending += d; if (e) syncErr = e.code === "quota_exceeded" ? "Storage is full. Export a backup and delete old days." : "Couldn't save the last change. Check your connection; it will retry on your next edit.";
  else if (!pending) syncErr = "";
  const el = document.getElementById("sync"); if (el) { el.textContent = syncErr; el.hidden = !syncErr; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  if (!db) return;
  put("app/settings", settingsBody());
  put("app/shopping", state.shop);
  for (const d of loadedDays) if (state.log[d]) put("days/" + d, { entries: state.log[d] });
}
// Live subscriptions: changes made on another device (or by Claude) show up without reloading.
let unsubDay = null;
function watchDay(d) {
  unsubDay && unsubDay();
  return new Promise(resolve => {
    unsubDay = db.doc("days/" + d).onSnapshot(snap => {
      const path = "days/" + d, body = snap.exists ? snap.data() : null;
      if (!snap.metadata.hasPendingWrites && !chainBusy(path)) {
        const js = body ? canon(body) : null;
        if (js !== synced[path] || !loadedDays.has(d)) {
          if (body) { state.log[d] = structuredClone(body.entries || []); synced[path] = canon({ entries: state.log[d] }); } else if (!loadedDays.has(d)) delete state.log[d];
          loadedDays.add(d); if (ui.date === d && !dlg.open && !ui.loading) render();
        }
      }
      resolve();
    }, () => { syncErr = "Lost the connection to your saved data. Reload the page."; syncStatus(0); resolve(); });
  });
}
const busy = {};
const chainBusy = path => busy[path] > 0;
function applySettings(b) {
  state.goals = b.goals || state.goals; state.ingredients = structuredClone(b.ingredients || []); state.recipes = structuredClone(b.recipes || []);
  state.prefs = { ...emptyPrefs(), ...structuredClone(b.prefs || {}) };
  synced["app/settings"] = canon(settingsBody());
}
async function connect() {
  if (!window.claude?.use) { ui.ai = null; return; }
  claude.use("sample").then(sm => { ui.ai = sm; if (ui.tab === "chat") render(); });
  const handle = await claude.use("db"); if (!handle) return;
  ui.loading = true; render();
  try {
    const snap = await handle.doc("app/settings").get();
    db = handle;
    if (snap.exists) {
      state.log = {}; applySettings(snap.data());
      const sh = await handle.doc("app/shopping").get();
      state.shop = sh.exists ? { ...emptyShop(), ...structuredClone(sh.data()) } : emptyShop();
      synced["app/shopping"] = canon(state.shop);
    }
    else {
      // First run in this account: carry over anything saved in this browser.
      Object.keys(state.log).forEach(d => loadedDays.add(d));
      save();
    }
    handle.doc("app/settings").onSnapshot(sn => {
      if (!sn.exists || sn.metadata.hasPendingWrites || chainBusy("app/settings") || canon(sn.data()) === synced["app/settings"]) return;
      applySettings(sn.data()); if (!dlg.open && !ui.loading) render();
    }, () => {});
    handle.doc("app/shopping").onSnapshot(sn => {
      if (!sn.exists || sn.metadata.hasPendingWrites || chainBusy("app/shopping") || canon(sn.data()) === synced["app/shopping"]) return;
      state.shop = { ...emptyShop(), ...structuredClone(sn.data()) }; synced["app/shopping"] = canon(state.shop);
      if (ui.tab === "shop" && !dlg.open && !ui.loading) render();
    }, () => {});
    await watchDay(ui.date);
  } catch { syncErr = "Couldn't load your saved data. Reload the page to try again."; }
  ui.loading = false; render();
}
async function goToDate(d) { ui.date = d; if (db) { ui.loading = !loadedDays.has(d); render(); await watchDay(d); ui.loading = false; } render(); }

// In-page confirmation (the claude.ai viewer ignores window.confirm).
function ask(msg, okLabel = "Delete") {
  return new Promise(res => {
    openDlg(`<p>${esc(msg)}</p><div class="row"><button type="button" class="grow" id="no">Cancel</button><button type="button" class="grow primary" id="yes">${esc(okLabel)}</button></div>`, d => {
      d.querySelector("#no").onclick = () => { closeDlg(); res(false); };
      d.querySelector("#yes").onclick = () => { closeDlg(); res(true); };
    });
  });
}
function notice(msg) { openDlg(`<p>${esc(msg)}</p><button type="button" class="primary" data-close>OK</button>`); }

// ---------- nutrition math ----------
const ZERO = () => ({ kcal: 0, p: 0, c: 0, f: 0 });
const add = (a, b, k = 1) => ({ kcal: a.kcal + b.kcal * k, p: a.p + b.p * k, c: a.c + b.c * k, f: a.f + b.f * k });
const ing = id => state.ingredients.find(i => i.id === id);
function recipeTotal(rec) {
  return rec.items.reduce((t, it) => { const i = ing(it.ingId); return i ? add(t, i, itemGrams(it) / 100) : t; }, ZERO());
}
function perServing(rec) { const t = recipeTotal(rec), s = rec.servings || 1; return add(ZERO(), t, 1 / s); }
const dayEntries = d => state.log[d] || [];
const dayTotal = d => dayEntries(d).reduce((t, e) => add(t, e), ZERO());
const macroLine = m => `<span>${r(m.kcal)} kcal</span> · <span class="dot-p">P ${r(m.p, 1)}</span> <span class="dot-c">C ${r(m.c, 1)}</span> <span class="dot-f">F ${r(m.f, 1)}</span>`;

// ---------- nutrition lookup ----------
// Typical values per 100 g (raw unless stated), averaged from common food tables.
// [name, kcal, protein, carbs, fat, aliases]
const FOODS = [
  ["Chicken breast", 120, 22.5, 0, 2.6, "chicken,chicken fillet,kureci prsa"],
  ["Chicken thigh (skinless)", 121, 19.7, 0, 4.1, "chicken thighs"],
  ["Beef mince", 254, 17.2, 0, 20, "ground beef,minced beef,hovezi mlete maso"],
  ["Lean beef mince", 176, 20, 0, 10, "lean ground beef,extra lean beef mince"],
  ["Beef steak", 158, 21, 0, 8, "steak,beef"],
  ["Pork mince", 263, 16.9, 0, 21.2, "ground pork,minced pork,veprove mlete maso"],
  ["Mixed mince (pork & beef)", 250, 17, 0, 20, "mixed mince,mlete maso"],
  ["Pork loin", 143, 21, 0, 5.9, "pork,pork chop,veprova panenka,vepr"],

  ["Tuna (canned in water)", 116, 25.5, 0, 0.8, "tuna,tuna in water,tunak"],
  ["Cod", 82, 17.8, 0, 0.7, "white fish,treska"],
  ["Shrimp", 85, 20, 0, 0.5, "prawns,prawn,krevety"],
  ["Egg", 143, 12.6, 0.7, 9.5, "eggs,whole egg,vejce,vajicko"],
  ["Egg white", 52, 10.9, 0.7, 0.2, "egg whites,bilek"],
  ["Whole milk", 61, 3.2, 4.8, 3.3, "milk,full fat milk,mleko"],
  ["Semi-skimmed milk", 46, 3.4, 4.8, 1.5, "semi skimmed milk,1.5% milk,polotucne mleko"],
  ["Skimmed milk", 34, 3.4, 5, 0.1, "skim milk,odtucnene mleko"],

  ["Almond milk (unsweetened)", 15, 0.5, 0.3, 1.2, "almond milk,almond drink,mandlove mleko"],
  ["Soy milk", 43, 3.3, 2.5, 1.8, "soya milk,soy drink,sojove mleko"],
  ["Plain yogurt", 61, 3.5, 4.7, 3.3, "yogurt,yoghurt,natural yogurt,bily jogurt,jogurt"],
  ["Greek yogurt (0% fat)", 59, 10.2, 3.6, 0.4, "fat free greek yogurt,0% greek yogurt"],
  ["Greek yogurt", 97, 9, 4, 5, "greek yoghurt,recky jogurt"],
  ["Skyr", 63, 11, 4, 0.2, ""],
  ["Cottage cheese", 98, 11.1, 3.4, 4.3, "cottage"],

  ["Cheddar", 403, 24.9, 1.3, 33.1, "cheese,hard cheese,syr,eidam,gouda"],

  ["White rice (cooked)", 130, 2.7, 28, 0.3, "cooked rice,boiled rice,varena ryze"],

  ["Wheat flour", 364, 10, 76, 1, "flour,plain flour,all purpose flour,mouka,hladka mouka"],
  ["Couscous (dry)", 376, 12.8, 77, 0.6, "couscous,kuskus"],

// Best built-in match for what the user typed, or null.
function findFood(query) {
  const q = norm(query); if (!q.length) return null;
  let best = null, bestScore = 0;
  for (const food of FOOD_INDEX) for (const k of food.keys) {
    let s = 0;
    if (k.join(" ") === q.join(" ")) s = 100;
    else if (q.every(w => k.includes(w))) s = 60 - (k.length - q.length);          // "chicken" -> "chicken breast"
    else if (k.every(w => q.includes(w))) s = 40 - (q.length - k.length) + k.length; // "diced onion" -> "onion"
    if (s > bestScore) { bestScore = s; best = food; }
  }
  return best && { ...best, strong: bestScore >= 50 };
}

// Median per-100g values across matching products on Open Food Facts.
async function lookupOnline(query) {
  const url = "https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=30&fields=product_name,nutriments&search_terms=" + encodeURIComponent(query);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) return null;
    const vals = ((await res.json()).products || []).map(pr => {
      const n = pr.nutriments || {};
      const kcal = n["energy-kcal_100g"] ?? (n.energy_100g != null ? n.energy_100g / 4.184 : null);
      const v = { kcal, p: n.proteins_100g, c: n.carbohydrates_100g, f: n.fat_100g };
      return Object.values(v).every(x => typeof x === "number" && isFinite(x) && x >= 0) && v.kcal <= 950 ? v : null;
    }).filter(Boolean);
    if (!vals.length) return null;
    const med = k => { const a = vals.map(v => v[k]).sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
    const rd = n => Math.round(n * 10) / 10;
    return { kcal: Math.round(med("kcal")), p: rd(med("p")), c: rd(med("c")), f: rd(med("f")), src: `online, median of ${vals.length} products` };
  } catch { return null; } finally { clearTimeout(timer); }
}

// Inside claude.ai: ask Claude for typical values when nothing else knows the food.
async function lookupAI(query) {

  try {
    const j = await sample.json(`Give typical nutrition values per 100 g for the food "${query}" as it is usually bought (raw unless the name says cooked), averaged from standard food composition tables. Reply with JSON only: {"name": short English food name, "kcal": number, "p": protein grams, "c": carbohydrate grams, "f": fat grams}. If "${query}" is not a food, reply {"name": null}.`, { modelTier: "quick" });
    const ok = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 900;
    if (!j || !j.name || !["kcal", "p", "c", "f"].every(k => ok(j[k]))) return null;
    return { name: String(j.name).slice(0, 60), kcal: Math.round(j.kcal), p: j.p, c: j.c, f: j.f, src: "estimated by Claude from typical values" };

}

// Nutrition for a typed name: your saved ingredient, else built-in table, else online average.
async function resolveFood(name, skipOwn = false) {
  const own = !skipOwn && ingByName(name); if (own) return { ...own, src: own.src || "your ingredient" };
  const b = findFood(name), fromTable = b && { name: b.name, kcal: b.kcal, p: b.p, c: b.c, f: b.f, pieceG: b.pieceG, piece: b.piece, pieces: b.pieces, src: `typical values for ${b.name}` };

}

// ---------- shopping ----------
// Everything the planned portions need, added up per ingredient across recipes.
function shoppingList() {
  const need = {};
  for (const [rid, portions] of Object.entries(state.shop.plan)) {
    const rc = state.recipes.find(x => x.id === rid); if (!rc || !(portions > 0)) continue;
    const scale = portions / (rc.servings || 1);
    for (const it of rc.items) {
      const i = ing(it.ingId); if (!i) continue;
      const row = need[i.id] ||= { i, grams: 0, from: new Set() };
      row.grams += itemGrams(it) * scale; row.from.add(rc.name);
    }
  }
  return Object.values(need).map(x => {
    const pc = pieceOf(x.i);
    // Round up to what you'd actually buy: whole pieces/cans, grams to the next 5 or 10.
    const qty = pc ? x.grams / pc.g : 0;
    const step = x.grams > 100 ? 10 : 5, base = x.i.name.replace(/\s*\(.*?\)/g, "").trim().toLowerCase();
    const label = pc ? countedName(Math.max(1, Math.ceil(qty - 0.05)), pc, base) : `${Math.ceil(x.grams / step) * step} g ${base}`;
    const note = pc && Math.abs(qty - Math.round(qty)) > 0.05 ? `${r(qty, 1)} needed` : pc ? `${r(x.grams)} g` : "";
    return { key: x.i.id, name: x.i.name, label, note, from: [...x.from].join(", ") };
  }).sort((a, b) => a.name.localeCompare(b.name));
}

// "3 onions", "2 bell peppers", "5 cloves garlic", "2 cans kidney beans".
function countedName(n, pc, base) {
  const words = base.split(/\s+/), bw = norm(base).join(" "), one = norm(pc.one).join(" "), unit = n == 1 ? pc.one : pc.many;
  if (bw === one || bw.endsWith(" " + one)) return `${n} ${[...words.slice(0, words.length - pc.one.split(" ").length), unit].join(" ")}`;
  if (bw.startsWith(one + " ")) return `${n} ${unit}`;
  return `${n} ${unit} ${base}`;
}

}

  if (!rows.length) rows.push(blank(), blank());

    };
    const statusHtml = x => {

    };
    // Unit picker: grams, or pieces when the food has a piece size (onion, clove of garlic, egg, slice, can…).
    const unitHtml = (x, k) => { const pc = pieceOf(x.n); return pc ? `<select data-k="${k}" data-f="unit" aria-label="Unit" style="width:auto"><option value="g" ${x.unit === "g" ? "selected" : ""}>g</option><option value="pc" ${x.unit === "pc" ? "selected" : ""}>${esc(pc.many)}</option></select>` : `<span class="muted" style="width:1.2em">g</span>`; };
    const refresh = k => { const x = rows[k], u = d.querySelector(`[data-u="${k}"]`), st = d.querySelector(`[data-st="${k}"]`); if (u) u.innerHTML = unitHtml(x, k); if (st) st.innerHTML = statusHtml(x); sum(); };
    const draw = () => {
      box.innerHTML = rows.map((x, k) => `<div class="row" style="margin-bottom:4px"><input list="foods" data-k="${k}" data-f="name" value="${esc(x.name)}" placeholder="e.g. onion" class="grow" style="min-width:0">
        <input data-k="${k}" data-f="amt" inputmode="decimal" value="${x.amt}" placeholder="amount" style="width:68px"><span data-u="${k}" class="row">${unitHtml(x, k)}</span><button type="button" class="small danger" data-rm="${k}" aria-label="Remove">✕</button></div><div data-st="${k}">${statusHtml(x)}</div>`).join("");
      sum();
    };
    const lookup = k => (rows[k].pending = doLookup(k));
    const doLookup = async k => {
      const x = rows[k], name = x.name.trim();
      if (!name) { x.n = null; x.status = ""; }
      else {
        x.status = "Looking up…"; x.n = null; refresh(k);
        const res = await resolveFood(name);
        if (rows[k] !== x || x.name.trim() !== name) return; // edited meanwhile
        x.n = res; x.status = res ? res.src : "Not found — try another name, or add it under Profile › My foods";
        // Counted foods default to pieces, unless a gram amount is already typed.
        const pc = pieceOf(res); x.unit = pc && (!num(x.amt) || num(x.amt) < 20) ? "pc" : "g";
      }
      refresh(k);
    };
    box.addEventListener("input", e => { const k = e.target.dataset.k; if (k == null) return; rows[k][e.target.dataset.f] = e.target.value; if (e.target.dataset.f !== "name") refresh(+k); });
    box.addEventListener("change", e => { const k = e.target.dataset.k; if (k == null) return; if (e.target.dataset.f === "name") lookup(+k); else { rows[k][e.target.dataset.f] = e.target.value; refresh(+k); } });
    box.onclick = e => { if (e.target.dataset.rm != null) { rows.splice(e.target.dataset.rm, 1); draw(); } };
    d.querySelector("#addRow").onclick = () => { rows.push(blank()); draw(); box.querySelector(`[data-k="${rows.length - 1}"]`).focus(); };
    f.servings.oninput = sum;
    draw();
    f.onsubmit = async e => {
      e.preventDefault();
      const err = d.querySelector("#err"), used = rows.filter(x => x.name.trim());
      // Resolve anything typed but not looked up yet (e.g. Save pressed straight after typing).
      err.textContent = "";
      used.forEach(x => { if (!x.n && !x.pending) lookup(rows.indexOf(x)); });
      await Promise.all(used.map(x => x.pending));
      const missing = used.filter(x => !x.n).map(x => x.name.trim());
      if (missing.length) { err.textContent = `Couldn't find: ${missing.join(", ")}. Change the name or add it under Profile › My foods.`; return; }
      if (!used.length) { err.textContent = "Add at least one ingredient."; return; }
      rc.name = f.name.value.trim(); rc.servings = num(f.servings.value) || 1;
      rc.items = used.map(x => { const ingId = ensureIngredient(x.name, x.n), pc = rowPiece(x);
        return pc ? { ingId, grams: rowGrams(x), qty: num(x.amt), unit: "pc" } : { ingId, grams: num(x.amt) }; });
      const k = state.recipes.findIndex(x => x.id === rc.id);
      if (k >= 0) state.recipes[k] = rc; else state.recipes.push(rc);
      onSaved && onSaved(rc);
      save(); closeDlg(); render();
    };
  });
}

// ---------- assistant ----------
// A chat with Claude (the "sample" capability) that turns "I made chili" into a saved recipe
// and log entry. Claude asks what went in and how many portions; the page does the maths.
ui.chat = []; ui.chatDraft = ""; ui.ai = undefined;
const AI_RULES = `You are the assistant inside a personal calorie and macro tracking app. The user tells you, in casual and possibly misspelled English or Czech, what they ate or cooked. Your job is to turn that into data the app can save. The app shows your recipe proposals as a checklist the user ticks and edits, so propose right away instead of asking questions.

How to behave:
- If they cooked something (e.g. "I made chilli con carne"), reply at once with a "recipe" proposal; do not ask questions first. List the usual ingredients of that dish with typical home-cooking amounts and "typical": true, then 3-6 common optional additions people often use in it with "typical": false (for chilli: sweetcorn, peppers, sour cream, grated cheese, dark chocolate…). The user ticks what they actually used and fixes amounts in the app. If they named ingredients or amounts, use exactly those (typical: true). Guess the number of portions if they didn't say (typical for the dish); they can change it.
- Foods people count (onions, garlic cloves, eggs, bananas, slices of bread, cans, chilies, potatoes…) are tracked by number: give "pieces" (the count) AND "grams" (count × typical weight: 1 medium onion = 110 g, 1 garlic clove = 5 g, 1 egg = 50 g, 1 slice of bread = 30 g, 1 can of beans drained = 240 g, 1 can of chopped tomatoes = 400 g). Never ask for grams of counted foods.
- Convert spoons and cups to grams yourself (1 tbsp oil = 13 g, 1 tsp = 5 g) and say what you assumed.
- Pasta, rice and grains: amounts are dry weight unless they say cooked. Meat: raw weight.
- If they ate one of their saved recipes (listed below), log it instead of making a new one; ask how many servings if unclear.
- If they just ate simple foods ("a banana and a coffee with milk"), log them directly with estimated grams.
- If they reply with corrections after a proposal, send an updated full proposal.
- If they ask for ideas, what to cook or what to eat (e.g. "ideas for dinner", "what should I meal prep", "what can I eat to hit my protein"), reply with an "ideas" proposal of 3 or 4 different dishes. Use their likes and cooking style, never use anything they avoid, and fit their goal (for a calorie or protein target, make the portions big enough; if they ask about the rest of today, aim at what is left). Each idea is a full recipe for the whole batch with realistic home-cooking amounts, a one-line "why" (how it fits them) and a rough "time". Vary them (different proteins/cuisines).
- For every item give typical nutrition per 100 g from standard food tables.
- Keep "say" short, friendly and plain text (with a recipe proposal, one sentence such as "Tick what you used and fix the amounts."). Reply in the language the user writes in.

Reply with ONLY one JSON object of this shape:
{"say": "text to show the user",
 "proposal": null
   OR {"kind": "recipe", "name": "Chilli con carne", "servings": 4, "items": [{"name": "Beef mince", "grams": 500, "typical": true, "per100": {"kcal": 254, "p": 17.2, "c": 0, "f": 20}}, {"name": "Onion", "pieces": 2, "grams": 220, "typical": true, "per100": {"kcal": 40, "p": 1.1, "c": 9.3, "f": 0.1}}, {"name": "Sweetcorn", "grams": 150, "typical": false, "per100": {"kcal": 86, "p": 3.3, "c": 19, "f": 1.2}}], "log": {"servings": 1, "meal": "Dinner"} or null}
   OR {"kind": "log", "items": [{"name": "Banana", "grams": 120, "meal": "Snack", "per100": {"kcal": 89, "p": 1.1, "c": 22.8, "f": 0.3}}]}
   OR {"kind": "log_recipe", "recipe": "exact saved recipe name", "servings": 1, "meal": "Breakfast"}
   OR {"kind": "ideas", "ideas": [{"name": "Chicken burrito bowls", "why": "Mexican, 50 g protein a portion, preps in one batch", "time": "30 min", "servings": 4, "items": [same item shape as a recipe, all "typical": true]}]}}
"meal" is one of Breakfast, Lunch, Dinner, Snack ("Snack" means anything outside the three meals). "log" inside a recipe proposal is set only if they said they ate some of it (or ate it just now).`;

function aiContext() {
  const h = new Date().getHours();
  return `Context from the app (not from the user):
- Current time: ${new Date().toTimeString().slice(0, 5)} (so a meal eaten "just now" is probably ${h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 22 ? "Dinner" : "Snack"}).
- Saved recipes: ${state.recipes.map(x => `${x.name} (${x.servings} servings)`).join("; ") || "none"}.
- Saved ingredients: ${state.ingredients.map(i => i.name).join(", ") || "none"}.
- Daily goal: ${r(state.goals.kcal)} kcal (${{ min: "trying to reach at least this, building muscle", max: "trying to stay under this, losing weight", range: "maintaining" }[state.goals.mode || "min"]}), protein ${r(state.goals.p)} g, carbs ${r(state.goals.c)} g, fat ${r(state.goals.f)} g.
- Eaten so far on ${ui.date === today() ? "today" : ui.date}: ${(t => `${r(t.kcal)} kcal, protein ${r(t.p)} g, carbs ${r(t.c)} g, fat ${r(t.f)} g`)(dayTotal(ui.date))}.
- Likes: ${[...state.prefs.likes, state.prefs.likeText].filter(Boolean).join(", ") || "not set"}.
- Avoid: ${state.prefs.avoid || "nothing listed"}.
- Cooking style: ${state.prefs.style.join(", ") || "not set"}.`;
}

async function aiSend(text) {
  if (!text.trim() || ui.chatBusy) return;
  ui.chat.push({ role: "user", text: text.trim() }); ui.chatDraft = ""; ui.chatBusy = true; ui.chatErr = ""; render();
  // Rules first, then the last 16 chat turns; the newest message carries fresh app context.
  const turns = ui.chat.slice(-16).map(m => ({ role: m.role, content: m.role === "user" ? m.text : m.raw }));
  turns[turns.length - 1] = { role: "user", content: aiContext() + "\n\nUser: " + turns[turns.length - 1].content };
  const input = [{ role: "user", content: AI_RULES }, ...turns];
  try {
    if (!ui.ai) throw { code: ui.ai === null ? "capability_disabled" : "connecting" };
    const j = await ui.ai.json(input, { cache: false });
    const say = typeof j?.say === "string" ? j.say : "";
    const proposal = j && typeof j.proposal === "object" ? aiProposal(j.proposal) : null;
    ui.chat.push({ role: "assistant", text: say || (proposal ? "Here's what I've got:" : "Sorry, I didn't get that."), raw: JSON.stringify(j), proposal });
  } catch (e) {
    ui.chat.pop(); ui.chatDraft = text;
    ui.chatErr = { rate_limited: "Too many messages for now. Wait a minute and send again.", session_expired: "Your Claude session expired. Sign in again, then send.", not_granted: "This app isn't allowed to use Claude. Allow it when asked, then send again.", invalid_json: "The answer came back garbled. Send it again.", connecting: "Still connecting to Claude. Send again in a second.", refused: "Claude couldn't answer that. Try rewording it." }[e?.code]
      || (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code) ? "The assistant isn't available in this view." : "Something went wrong reaching Claude. Send it again.");
  }
  ui.chatBusy = false; render();
}

// Validate Claude's proposal and attach the app's own nutrition values where it has them.
function aiProposal(p) {
  if (!p) return null;
  const meal = m => MEALS.includes(m) ? m : "Snack";
  const item = x => {
    const name = String(x?.name || "").trim(), grams = num(x?.grams); if (!name) return null;
    const own = ingByName(name), b = !own && findFood(name), c = x.per100 || {};
    const n = own ? { ...own, src: own.src || "your ingredient" }
      : b?.strong ? { name: b.name, kcal: b.kcal, p: b.p, c: b.c, f: b.f, pieceG: b.pieceG, piece: b.piece, pieces: b.pieces, src: `typical values for ${b.name}` }
      : { name, kcal: num(c.kcal), p: num(c.p), c: num(c.c), f: num(c.f), src: "estimated by Claude from typical values" };
    // Counted foods: keep the count and use the app's piece weight.
    const qty = num(x.pieces), pc = qty && pieceOf(n);
    // Counted foods start as a count of pieces; everything else in grams. "on" = ticked in the checklist.
    const pcAny = pieceOf(n), useCount = pc || (pcAny && !grams);
    return { name: own ? own.name : name, grams: pc ? qty * pc.g : grams, qty: pc ? qty : 0, pc, n, meal: meal(x.meal),
      on: x.typical !== false, opt: x.typical === false, amt: useCount ? (qty || 1) : grams, unitPc: useCount ? pcAny : null };
  };
  if (p.kind === "recipe") {
    const items = (p.items || []).map(item).filter(Boolean); if (!items.length) return null;
    const h = new Date().getHours();
    return { kind: "recipe", name: String(p.name || "Recipe").trim(), servings: num(p.servings) || 1, items,
      logOn: !!p.log, logServings: num(p.log?.servings) || 1, meal: p.log ? meal(p.log.meal) : h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 22 ? "Dinner" : "Snack" };
  }
  if (p.kind === "log") { const items = (p.items || []).map(item).filter(Boolean); return items.length ? { kind: "log", items } : null; }
  if (p.kind === "ideas") {
    const ideas = (p.ideas || []).slice(0, 5).map(x => ({ name: String(x?.name || "").trim(), why: String(x?.why || ""), time: String(x?.time || ""), servings: num(x?.servings) || 1, items: (x?.items || []).map(item).filter(Boolean) })).filter(x => x.name && x.items.length);
    return ideas.length ? { kind: "ideas", ideas } : null;
  }
  if (p.kind === "log_recipe") {
    const rc = state.recipes.find(x => norm(x.name).join(" ") === norm(p.recipe || "").join(" "));
    return rc ? { kind: "log_recipe", recipeId: rc.id, servings: num(p.servings) || 1, meal: meal(p.meal) } : null;
  }
  return null;
}

const pickGrams = x => x.unitPc ? num(x.amt) * x.unitPc.g : num(x.amt);
// Live totals for a checklist card, without re-rendering (keeps focus in the inputs).
function refreshPick(k) {
  const p = ui.chat[k]?.proposal; if (!p || p.done) return;
  let t = ZERO(), n = 0;
  p.items.forEach((x, i) => {
    const g = pickGrams(x), kc = document.querySelector(`[data-kc="${k}:${i}"]`), row = document.querySelector(`[data-row="${k}:${i}"]`);
    if (kc) kc.textContent = x.on ? `${r(x.n.kcal * g / 100)} kcal` : "";
    if (row) row.classList.toggle("off", !x.on);
    if (x.on) { t = add(t, x.n, g / 100); n++; }
  });
  const sv = num(p.servings) || 1, tot = document.querySelector(`[data-tot="${k}"]`), btn = document.querySelector(`[data-savebtn="${k}"]`);
  if (tot) tot.innerHTML = `<div class="muted" style="margin-top:8px">${n} ingredient${n == 1 ? "" : "s"} · whole pot ${r(t.kcal)} kcal</div><div class="muted">Per portion</div><b>${macroLine(add(ZERO(), t, 1 / sv))}</b>`;
  if (btn) btn.textContent = p.logOn ? `Save & log ${r(p.logServings, 2)} to ${mealName(p.meal)}` : "Save recipe";
}
async function aiAddItem(k) {
  const p = ui.chat[k]?.proposal, inp = document.querySelector(`[data-pk="${k}"][data-pf="newName"]`); if (!p || !inp) return;
  const raw = inp.value.trim(); if (!raw) return;
  // "2 carrots" or "carrot 150" → name + amount
  const m = raw.match(/^(\d+(?:[.,]\d+)?)\s*(g\b)?\s*(.+)$/i) || raw.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(g)?$/i);
  const name = m ? (/^\d/.test(raw) ? m[3] : m[1]) : raw, amount = m ? num(/^\d/.test(raw) ? m[1] : m[2]) : 0, grams = m && (/^\d/.test(raw) ? m[2] : m[3]);
  inp.disabled = true; inp.value = "Looking up…";
  const n = await resolveFood(name);
  if (!n) { inp.disabled = false; inp.value = raw; inp.placeholder = "Couldn't find that, try another name"; return; }
  const pc = !grams && pieceOf(n);
  p.items.push({ name: n.name || name, n, on: true, unitPc: pc || null, amt: amount || (pc ? 1 : 100) });
  render();
}

function proposalCard(p, k) {
  const done = p.done ? `<p class="ok">${esc(p.done)}</p>` : "";
  if (p.kind === "recipe") {
    if (p.done) return `<div class="card prop"><b>${esc(p.name)}</b>${done}</div>`;
    const row = (x, i) => `<div class="pick${x.on ? "" : " off"}" data-row="${k}:${i}">
        <input type="checkbox" data-pk="${k}" data-pi="${i}" data-pf="on" ${x.on ? "checked" : ""} aria-label="Used ${esc(x.name)}">
        <div class="pick-name"><div>${esc(x.name)}</div>${/estimated/.test(x.n.src) ? `<div class="muted">estimate</div>` : ""}</div>
        <input class="pick-amt" inputmode="decimal" data-pk="${k}" data-pi="${i}" data-pf="amt" value="${r(x.amt, 2)}" aria-label="Amount of ${esc(x.name)}">
        <span class="pick-unit">${x.unitPc ? esc(x.unitPc.many) : "g"}</span>

      <div class="row" style="margin-top:8px"><input data-pk="${k}" data-pf="newName" placeholder="Something else? e.g. carrot" class="grow" style="min-width:0" aria-label="Add an ingredient"><button class="small" data-act="aiAddItem" data-v="${k}">+ Add</button></div>
      <div class="pick-meta">
        <label class="inline">Portions it made <input inputmode="decimal" data-pk="${k}" data-pf="servings" value="${r(p.servings, 2)}"></label>

    return `<div class="card prop idea"><div class="row between"><b>${esc(x.name)}</b>${x.time ? `<span class="muted">${esc(x.time)}</span>` : ""}</div>

      <div class="muted">${x.items.map(it => esc(it.name.toLowerCase())).join(", ")}</div>
      <div style="margin-top:6px"><span class="muted">Per portion (makes ${r(x.servings, 2)}):</span> <b>${macroLine(per)}</b></div>
      ${x.used ? `<p class="ok">Opened below.</p>` : `<button class="small primary" style="margin-top:8px" data-act="aiApply" data-v="${k}:idea:${i}">Cook this</button>`}</div>`;

  if (p.kind === "log") {

    return `<div class="card prop">${p.items.map(x => `<div class="item"><div><div>${esc(x.name)} <span class="muted">${x.pc ? countLabel(x.qty, x.pc) : `${r(x.grams)} g`} · ${mealName(x.meal)}</span></div><div class="muted">${esc(x.n.src)}</div></div><span class="muted">${r(x.n.kcal * x.grams / 100)} kcal</span></div>`).join("")}
      <div style="margin-top:6px"><b>${macroLine(t)}</b></div>${done || `<button class="small primary" style="margin-top:10px" data-act="aiApply" data-v="${k}:log">Log it</button>`}</div>`;
  }
  const rc = state.recipes.find(x => x.id === p.recipeId);
  if (!rc) return "";
  return `<div class="card prop"><b>${esc(rc.name)}</b> <span class="muted">× ${r(p.servings, 2)} · ${mealName(p.meal)}</span><div>${macroLine(add(ZERO(), perServing(rc), p.servings))}</div>
    ${done || `<button class="small primary" style="margin-top:10px" data-act="aiApply" data-v="${k}:log">Log it</button>`}</div>`;
}

function aiApply(v) {
  const [k, how, idx] = v.split(":"), p = ui.chat[k].proposal;
  if (how === "idea") {
    const x = p.ideas[idx], h = new Date().getHours(); x.used = true;
    const proposal = { kind: "recipe", name: x.name, servings: x.servings, items: x.items.map(it => ({ ...it, on: true, opt: false })), logOn: false, logServings: 1, meal: h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 22 ? "Dinner" : "Snack" };
    ui.chat.push({ role: "assistant", text: `${x.name}: tick what you'll use, change amounts and portions, then save it as a recipe. You can then plan it on the Shop tab.`, raw: JSON.stringify({ say: `Chose idea: ${x.name}`, proposal: { kind: "recipe", name: x.name, servings: x.servings } }), proposal });
    return;
  }
  const day = ui.date === today() ? "today" : ui.date;
  if (p.kind === "recipe") {
    const used = p.items.filter(x => x.on && pickGrams(x) > 0);
    if (!used.length) { const t = document.querySelector(`[data-tot="${k}"]`); if (t) t.innerHTML = `<p class="sync">Tick at least one ingredient.</p>`; return; }
    if (how === "edit") {
      recipeDialog(null, { name: p.name, servings: p.servings, rows: used.map(x => ({ name: x.name, amt: x.amt, unit: x.unitPc ? "pc" : "g", n: x.n, status: x.n.src })) }, rc => { p.done = `Saved "${rc.name}".`; });
      return;
    }
    const rc = { id: uid(), name: p.name || "Recipe", servings: num(p.servings) || 1, fav: false,
      items: used.map(x => ({ ingId: ensureIngredient(x.name, x.n), grams: pickGrams(x), ...(x.unitPc && { qty: num(x.amt), unit: "pc" }) })) };
    state.recipes.push(rc);
    if (p.logOn) pushEntry(p.meal, { name: rc.name, amount: `${r(p.logServings, 2)} serving${p.logServings == 1 ? "" : "s"}`, ...add(ZERO(), perServing(rc), p.logServings) });
    p.done = `Saved "${rc.name}" (${used.length} ingredients, ${r(rc.servings, 2)} portions)${p.logOn ? ` and logged ${r(p.logServings, 2)} to ${mealName(p.meal)} (${day})` : ""}.`;
  } else if (p.kind === "log") {
    p.items.forEach(x => { const i = ing(ensureIngredient(x.name, x.n)); pushEntry(x.meal, { name: i.name, amount: x.pc ? `${countLabel(x.qty, x.pc)} (${r(x.grams)} g)` : `${r(x.grams)} g`, ...add(ZERO(), i, x.grams / 100) }); });
    p.done = `Logged ${p.items.length} item${p.items.length == 1 ? "" : "s"} (${day}).`;
  } else {
    const rc = state.recipes.find(x => x.id === p.recipeId); if (!rc) return;
    pushEntry(p.meal, { name: rc.name, amount: `${r(p.servings, 2)} serving${p.servings == 1 ? "" : "s"}`, ...add(ZERO(), perServing(rc), p.servings) });
    p.done = `Logged to ${mealName(p.meal)} (${day}).`;
  }
  save();
}

function viewChat() {
  if (ui.ai === null) return `<h2>Assistant</h2><div class="card"><p>The assistant uses Claude, so it only works when you open this app in Claude (claude.ai or the Claude app).</p></div>`;
  const examples = ["I made chilli con carne", "Give me dinner ideas", "High protein meal prep ideas", "What can I eat to hit my goal today?", "I had my oats breakfast"];
  return `<div class="row between"><h2>Assistant</h2>${ui.chat.length ? `<button class="small" data-act="aiReset">New chat</button>` : ""}</div>
  <div id="chatLog" class="chat">
    ${ui.chat.length ? "" : `<div class="card"><p style="margin-top:0">Tell me what you ate or cooked and I'll turn it into a tick-box list to save. Or ask me for meal ideas: I'll use the food preferences in your profile.</p><div class="chips">${examples.map(x => `<button class="small" data-act="aiExample" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`}
    ${ui.chat.map((m, k) => `<div class="msg ${m.role}">${esc(m.text)}</div>${m.proposal ? proposalCard(m.proposal, k) : ""}`).join("")}
    ${ui.chatBusy ? `<div class="msg assistant muted">Thinking…</div>` : ""}
  </div>
  ${ui.chatErr ? `<p class="sync" role="alert">${esc(ui.chatErr)}</p>` : ""}
  <form class="composer" data-form="chat"><textarea id="chatIn" rows="2" placeholder="e.g. I made chilli, 4 portions" ${ui.chatBusy ? "disabled" : ""}>${esc(ui.chatDraft)}</textarea><button class="primary" ${ui.chatBusy ? "disabled" : ""}>Send</button></form>
  <p class="muted" style="margin-top:6px">Logs go to ${ui.date === today() ? "today" : ui.date}. Values are estimates; fix any amount before saving.</p>`;
}

// ---------- events ----------
const actions = {
  tab: v => { ui.tab = v; },
  date: v => { ui.date = v; },
  addEntry: v => entryDialog(v),
  calendar: () => calendarDialog(),
  aiApply: v => aiApply(v),
  aiAddItem: v => aiAddItem(v),
  aiReset: () => { ui.chat = []; ui.chatErr = ""; },
  recCat: v => { ui.recCat = v; },
  prefChip: v => { const [k, x] = [v.slice(0, v.indexOf(":")), v.slice(v.indexOf(":") + 1)], a = state.prefs[k]; const i = a.indexOf(x); if (i >= 0) a.splice(i, 1); else a.push(x); save(); },
  shopAdd: v => { const rc = state.recipes.find(x => x.id === v); if (!rc) return; state.shop.plan[v] = rc.servings || 1; ui.shopQ = ""; save(); },
  shopStep: v => { const [id, d] = v.split(":"), n = Math.max(0, (state.shop.plan[id] || 0) + +d); if (n) state.shop.plan[id] = n; else delete state.shop.plan[id]; save(); },
  shopTick: v => { if (state.shop.checked[v]) delete state.shop.checked[v]; else state.shop.checked[v] = true; save(); },
  shopTickExtra: v => { const x = state.shop.extra.find(e => e.id === v); if (x) { x.done = !x.done; save(); } },
  shopUntick: () => { state.shop.checked = {}; state.shop.extra.forEach(x => x.done = false); save(); },
  shopClear: async () => { if (await ask("Clear the planned portions, ticks and extra items?", "Clear")) { state.shop = emptyShop(); save(); render(); } },
  shopCopy: async () => {
    const text = shopText(), done = () => { const c = document.getElementById("copied"); if (c) c.hidden = false; };
    try { await navigator.clipboard.writeText(text); done(); }
    catch { openDlg(`<h3>Copy the list</h3><textarea id="shopTxt" rows="10" style="width:100%" readonly>${esc(text)}</textarea><button type="button" class="primary" data-close style="margin-top:8px">Done</button>`, d => d.querySelector("#shopTxt").select()); }
  },
  aiExample: v => { ui.chatDraft = v; setTimeout(() => { const t = document.getElementById("chatIn"); t && (t.focus(), t.setSelectionRange(v.length, v.length)); }); },
  logRecipe: v => { ui.tab = "today"; entryDialog("Lunch", v); },
  delEntry: v => { state.log[ui.date] = dayEntries(ui.date).filter(e => e.id !== v); save(); },
  editIng: v => ingDialog(v),
  delIng: async v => {
    const used = state.recipes.filter(rc => rc.items.some(it => it.ingId === v)).map(rc => rc.name);
    if (!await ask(used.length ? `Used in: ${used.join(", ")}. Delete anyway? It will count as 0 in those recipes.` : "Delete this ingredient?")) return;
    state.ingredients = state.ingredients.filter(i => i.id !== v); save(); render();
  },
  editRecipe: v => recipeDialog(v),
  favRecipe: v => { const rc = state.recipes.find(x => x.id === v); rc.fav = !rc.fav; save(); },
  dupRecipe: v => { const rc = structuredClone(state.recipes.find(x => x.id === v)); rc.id = uid(); rc.name += " (copy)"; rc.fav = false; state.recipes.push(rc); save(); },
  delRecipe: async v => { if (await ask("Delete this recipe? Days you already logged keep their numbers.")) { state.recipes = state.recipes.filter(x => x.id !== v); delete state.shop.plan[v]; save(); render(); } },
  export: async () => {
    // Backup includes every logged day, so fetch the ones not loaded yet.
    if (db) try { (await db.collection("days").limit(1000).get()).docs.forEach(x => { if (!loadedDays.has(x.id)) { state.log[x.id] = structuredClone(x.data().entries || []); loadedDays.add(x.id); synced["days/" + x.id] = canon({ entries: state.log[x.id] }); } }); } catch {}
    const data = JSON.stringify(state, null, 2), filename = `calorie-backup-${today()}.json`;
    const dl = window.claude?.use ? await claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename, data }); } catch (e) { if (e.code !== "declined") notice("The backup couldn't be saved here."); } return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; a.click();
  },
  import: () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = async () => {
      let d;
      try { d = JSON.parse(await inp.files[0].text()); if (!Array.isArray(d.ingredients) || !Array.isArray(d.recipes) || typeof d.log !== "object") throw 0; }
      catch { notice("That file isn't a backup from this app."); return; }
      if (!await ask("Replace your ingredients, recipes and goals with this backup? Days in the backup replace the same days here.", "Replace")) return;
      state = { goals: d.goals || state.goals, ingredients: d.ingredients, recipes: d.recipes, log: { ...state.log, ...d.log }, shop: d.shop || state.shop };
      Object.keys(d.log).forEach(x => loadedDays.add(x)); save(); render();
    };
    inp.click();
  },
};

document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeDlg();
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  if (el.dataset.act === "date") return goToDate(el.dataset.v);
  actions[el.dataset.act](el.dataset.v);
  if (!dlg.open) render();
});
function pickField(el) {
  const k = el.dataset.pk, p = ui.chat[k]?.proposal, f = el.dataset.pf; if (!p || f === "newName") return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.pi != null) p.items[el.dataset.pi][f] = v; else p[f] = v;
  refreshPick(k);
}
document.addEventListener("change", e => {
  if (e.target.id === "prefLikeText" || e.target.id === "prefAvoid") { state.prefs[e.target.id === "prefAvoid" ? "avoid" : "likeText"] = e.target.value.trim(); save(); return; }
  if (e.target.dataset.pk != null) { pickField(e.target); return; }
  if (e.target.type === "checkbox" && e.target.dataset.act) { actions[e.target.dataset.act](e.target.dataset.v); render(); return; }
  if (e.target.dataset.shop) { const n = num(e.target.value); if (n) state.shop.plan[e.target.dataset.shop] = n; else delete state.shop.plan[e.target.dataset.shop]; save(); render(); return; }
  if (e.target.dataset.act === "pickDate" && e.target.value) goToDate(e.target.value);
});
document.addEventListener("input", e => {
  if (e.target.id === "chatIn") { ui.chatDraft = e.target.value; return; }
  if (e.target.dataset.pk != null) { pickField(e.target); return; }
  if (e.target.id === "recSearch") { ui.recQ = e.target.value; document.getElementById("recList").innerHTML = recipeCards(); return; }
  if (e.target.id === "shopSearch") { ui.shopQ = e.target.value; document.getElementById("shopResults").innerHTML = shopResults(); return; }
  const f = e.target.closest("[data-form=goals]"); if (!f) return;
  const kcalFromMacros = num(f.p.value) * 4 + num(f.c.value) * 4 + num(f.f.value) * 9;
  document.getElementById("gcheck").textContent = `Macros add up to ${r(kcalFromMacros)} kcal (protein 4, carbs 4, fat 9 per gram).`;
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chatIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiSend(e.target.value); }
  if (e.target.dataset.pf === "newName" && e.key === "Enter") { e.preventDefault(); aiAddItem(e.target.dataset.pk); }
});
document.addEventListener("submit", e => {
  if (e.target.dataset.form === "shopExtra") {
    e.preventDefault(); const t = document.getElementById("shopExtra").value.trim();
    if (t) { state.shop.extra.push({ id: uid(), text: t, done: false }); save(); render(); document.getElementById("shopExtra")?.focus(); }
    return;
  }
  if (e.target.dataset.form === "chat") { e.preventDefault(); aiSend(document.getElementById("chatIn").value); return; }
  const f = e.target.closest("[data-form=goals]"); if (!f) return;
  e.preventDefault();
  state.goals = { kcal: num(f.kcal.value), p: num(f.p.value), c: num(f.c.value), f: num(f.f.value), mode: f.mode.value };
  save(); ui.tab = "today"; render();
});

render();
connect();
</script>
</body>
</html>
