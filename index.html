<!doctype html>

<title>Kitchen Macros</title>
<style>
/* One-column mobile app: day summary on top, meal cards below, tab bar fixed at the bottom. */
:root{--bg:#f3f5f1;--card:#fff;--text:#1b211c;--muted:#667067;--line:#e1e6df;--accent:#2f8a4c;--on-accent:#fff;--p:#2f6fd6;--c:#c98a0b;--f:#d2453a;--danger:#c7362b;--danger-bg:#fbe9e7;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121512;--card:#1b201c;--text:#e9eee8;--muted:#98a397;--line:#2c332d;--accent:#4fb56d;--on-accent:#0d1a10;--p:#6ea1f0;--c:#e4ad3c;--f:#f07a6f;--danger:#f07a6f;--danger-bg:#3a1c19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121512;--card:#1b201c;--text:#e9eee8;--muted:#98a397;--line:#2c332d;--accent:#4fb56d;--on-accent:#0d1a10;--p:#6ea1f0;--c:#e4ad3c;--f:#f07a6f;--danger:#f07a6f;--danger-bg:#3a1c19;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.sync{max-width:640px;margin:8px auto 0;padding:8px 12px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:.9rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:8px 0}h3{margin:0 0 6px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
.muted{color:var(--muted);font-size:.85rem}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:.85rem}
input,select{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;background:none}
nav button.on{color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:2rem;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(94vw,520px);padding:16px;max-height:90vh}
dialog::backdrop{background:rgb(0 0 0 / .5)}
.dot-p{color:var(--p)}.dot-c{color:var(--c)}.dot-f{color:var(--f)}
</style>
</head>

let state = load();
let ui = { tab: "today", date: today() };

function load() {
  const def = { ingredients: [], recipes: [], log: {}, goals: { kcal: 2000, p: 150, c: 200, f: 65 } };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { return def; }
}

// ---------- storage ----------
// Inside claude.ai the data lives in the artifact's database (synced across devices):
// "app/settings" holds goals, ingredients and recipes; "days/<date>" holds one day's log.
// Opened as a plain file it falls back to this browser's localStorage.
let db = null;
const synced = {}, chains = {}, loadedDays = new Set();
function put(path, body) {
  const js = JSON.stringify(body); if (synced[path] === js) return; synced[path] = js;
  syncStatus(1);
  chains[path] = (chains[path] || Promise.resolve()).then(() => db.doc(path).set(body))
    .then(() => syncStatus(-1), e => { delete synced[path]; syncStatus(-1, e); });
}
let pending = 0, syncErr = "";
function syncStatus(d, e) {
  pending += d; if (e) syncErr = e.code === "quota_exceeded" ? "Storage is full. Export a backup and delete old days." : "Couldn't save the last change. Check your connection; it will retry on your next edit.";
  else if (!pending) syncErr = "";
  const el = document.getElementById("sync"); if (el) { el.textContent = syncErr; el.hidden = !syncErr; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  if (!db) return;
  put("app/settings", { goals: state.goals, ingredients: state.ingredients, recipes: state.recipes });
  for (const d of loadedDays) if (state.log[d]) put("days/" + d, { entries: state.log[d] });
}
async function loadDay(d) {
  if (!db || loadedDays.has(d)) return;
  try {
    const snap = await db.doc("days/" + d).get();
    if (snap.exists) { const body = snap.data(); state.log[d] = structuredClone(body.entries || []); synced["days/" + d] = JSON.stringify({ entries: state.log[d] }); }
    else delete state.log[d];
    loadedDays.add(d);
  } catch { syncErr = "Couldn't load this day. Check your connection and open it again."; }
}
async function connect() {
  if (!window.claude?.use) return;
  const handle = await claude.use("db"); if (!handle) return;
  ui.loading = true; render();
  try {
    const snap = await handle.doc("app/settings").get();
    db = handle;
    if (snap.exists) {
      const b = structuredClone(snap.data());
      state = { goals: b.goals || state.goals, ingredients: b.ingredients || [], recipes: b.recipes || [], log: {} };
      synced["app/settings"] = JSON.stringify({ goals: state.goals, ingredients: state.ingredients, recipes: state.recipes });
    } else {
      // First run in this account: carry over anything saved in this browser.
      Object.keys(state.log).forEach(d => loadedDays.add(d));
      save();
    }
    await loadDay(ui.date);
  } catch { syncErr = "Couldn't load your saved data. Reload the page to try again."; }
  ui.loading = false; render();
}
async function goToDate(d) { ui.date = d; if (db && !loadedDays.has(d)) { ui.loading = true; render(); await loadDay(d); ui.loading = false; } render(); }

// In-page confirmation (the claude.ai viewer ignores window.confirm).
function ask(msg, okLabel = "Delete") {

      d.querySelector("#no").onclick = () => { closeDlg(); res(false); };
      d.querySelector("#yes").onclick = () => { closeDlg(); res(true); };

const ing = id => state.ingredients.find(i => i.id === id);
function recipeTotal(rec) {

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9% ]/g, " ").trim().split(/\s+/).filter(Boolean)
  .map(w => w.length > 4 ? w.replace(/(oes|es|s)$/, m => m === "oes" ? "o" : "") : w);
const FOOD_INDEX = FOODS.map(([name, kcal, p, c, f, al]) => ({ name, kcal, p, c, f, keys: [name, ...al.split(",").filter(Boolean)].map(norm) }));

// Best built-in match for what the user typed, or null.
function findFood(query) {
  const q = norm(query); if (!q.length) return null;
  let best = null, bestScore = 0;
  for (const food of FOOD_INDEX) for (const k of food.keys) {
    let s = 0;
    if (k.join(" ") === q.join(" ")) s = 100;
    else if (q.every(w => k.includes(w))) s = 60 - (k.length - q.length);          // "chicken" -> "chicken breast"
    else if (k.every(w => q.includes(w))) s = 40 - (q.length - k.length) + k.length; // "diced onion" -> "onion"
    if (s > bestScore) { bestScore = s; best = food; }
  }
  return best && { ...best, strong: bestScore >= 50 };
}

// Median per-100g values across matching products on Open Food Facts.
async function lookupOnline(query) {
  const url = "https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=30&fields=product_name,nutriments&search_terms=" + encodeURIComponent(query);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) return null;
    const vals = ((await res.json()).products || []).map(pr => {
      const n = pr.nutriments || {};
      const kcal = n["energy-kcal_100g"] ?? (n.energy_100g != null ? n.energy_100g / 4.184 : null);
      const v = { kcal, p: n.proteins_100g, c: n.carbohydrates_100g, f: n.fat_100g };
      return Object.values(v).every(x => typeof x === "number" && isFinite(x) && x >= 0) && v.kcal <= 950 ? v : null;
    }).filter(Boolean);
    if (!vals.length) return null;
    const med = k => { const a = vals.map(v => v[k]).sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
    const rd = n => Math.round(n * 10) / 10;
    return { kcal: Math.round(med("kcal")), p: rd(med("p")), c: rd(med("c")), f: rd(med("f")), src: `online, median of ${vals.length} products` };
  } catch { return null; } finally { clearTimeout(timer); }
}

// Inside claude.ai: ask Claude for typical values when nothing else knows the food.
async function lookupAI(query) {
  const sample = window.claude?.use ? await claude.use("sample") : null; if (!sample) return null;
  try {
    const j = await sample.json(`Give typical nutrition values per 100 g for the food "${query}" as it is usually bought (raw unless the name says cooked), averaged from standard food composition tables. Reply with JSON only: {"name": short English food name, "kcal": number, "p": protein grams, "c": carbohydrate grams, "f": fat grams}. If "${query}" is not a food, reply {"name": null}.`, { modelTier: "quick" });
    const ok = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 900;
    if (!j || !j.name || !["kcal", "p", "c", "f"].every(k => ok(j[k]))) return null;
    return { name: String(j.name).slice(0, 60), kcal: Math.round(j.kcal), p: j.p, c: j.c, f: j.f, src: "estimated by Claude from typical values" };
  } catch { return null; }
}
const ingByName = name => { const k = norm(name).join(" "); return state.ingredients.find(i => norm(i.name).join(" ") === k); };

// Nutrition for a typed name: your saved ingredient, else built-in table, else online average.
async function resolveFood(name, skipOwn = false) {
  const own = !skipOwn && ingByName(name); if (own) return { ...own, src: own.src || "your ingredient" };
  const b = findFood(name), fromTable = b && { name: b.name, kcal: b.kcal, p: b.p, c: b.c, f: b.f, src: `typical values for ${b.name}` };
  if (b?.strong) return fromTable;
  // Only a loose match (e.g. "almond milk" ~ "milk"): prefer the online average, fall back to the table.
  const o = await lookupOnline(name); if (o) return { name: name.trim(), ...o };
  return fromTable || await lookupAI(name);
}
function ensureIngredient(name, n) {
  const own = ingByName(name) || ingByName(n.name); if (own) return own.id;
  const i = { id: uid(), name: n.name || name.trim(), kcal: n.kcal, p: n.p, c: n.c, f: n.f, src: n.src };
  state.ingredients.push(i); return i.id;
}
const foodDatalist = () => `<datalist id="foods">${[...new Set([...state.ingredients.map(i => i.name), ...FOODS.map(x => x[0])])].map(n => `<option value="${esc(n)}">`).join("")}</datalist>`;

// ---------- dialog helper ----------
const dlg = document.getElementById("dlg");
function openDlg(html, onOpen) { dlg.innerHTML = html; dlg.showModal(); onOpen && onOpen(dlg); }
function closeDlg() { dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });

// ---------- rendering ----------
const TABS = [["today", "Today"], ["recipes", "Recipes"], ["ingredients", "Ingredients"], ["goals", "Goals"]];
function render() {
  document.getElementById("nav").innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-v="${k}" class="${ui.tab === k ? "on" : ""}">${n}</button>`).join("");
  document.getElementById("app").innerHTML = { today: viewToday, recipes: viewRecipes, ingredients: viewIngredients, goals: viewGoals }[ui.tab]();
}

function progress(label, val, goal, unit) {
  const pct = goal ? Math.min(100, val / goal * 100) : 0;
  return `<div><div class="row between muted"><span>${label}</span><span>${r(val)} / ${r(goal)}${unit}</span></div>
  <div class="bar ${goal && val > goal ? "over" : ""}"><i style="width:${pct}%"></i></div></div>`;
}

function viewToday() {
  if (ui.loading) return `<p class="muted" style="text-align:center;margin-top:40px">Loading your log…</p>`;
  const g = state.goals, t = dayTotal(ui.date), left = g.kcal - t.kcal;
  const shift = n => { const d = new Date(ui.date + "T12:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const meals = MEALS.map(m => {
    const es = dayEntries(ui.date).filter(e => e.meal === m);
    const sub = es.reduce((a, e) => add(a, e), ZERO());
    return `<div class="card"><div class="row between"><h3>${m}</h3><span class="muted">${r(sub.kcal)} kcal</span></div>
      ${es.map(e => `<div class="item"><div><div>${esc(e.name)}</div><div class="muted">${esc(e.amount || "")} · ${macroLine(e)}</div></div>
        <button class="small danger" data-act="delEntry" data-v="${e.id}">✕</button></div>`).join("")}
      <button class="small" data-act="addEntry" data-v="${m}">+ Add</button></div>`;
  }).join("");
  return `<div class="row between"><button data-act="date" data-v="${shift(-1)}">‹</button>
    <div class="grow" style="text-align:center"><b>${ui.date === today() ? "Today" : ui.date}</b>
    <input type="date" value="${ui.date}" data-act="pickDate" style="margin-top:4px"></div>
    <button data-act="date" data-v="${shift(1)}">›</button></div>
  <div class="card" style="margin-top:12px"><div class="row between"><div><div class="big">${r(t.kcal)}</div><div class="muted">eaten</div></div>
    <div style="text-align:right"><div class="big" style="color:${left < 0 ? "var(--danger)" : "var(--accent)"}">${r(Math.abs(left))}</div><div class="muted">${left < 0 ? "over" : "left"}</div></div></div>
    ${progress("Calories", t.kcal, g.kcal, "")}${progress("Protein", t.p, g.p, "g")}${progress("Carbs", t.c, g.c, "g")}${progress("Fat", t.f, g.f, "g")}</div>${meals}`;
}

function viewRecipes() {
  const list = [...state.recipes].sort((a, b) => (b.fav || 0) - (a.fav || 0) || a.name.localeCompare(b.name));
  return `<div class="row between"><h2>Recipes</h2><button class="primary" data-act="editRecipe">+ New</button></div>
  ${list.length ? "" : `<p class="muted">No recipes yet. Tap + New, type what went in (e.g. "beef mince 500", "onion 150", "kidney beans 400") and how many servings it made — the macros are calculated for you.</p>`}
  ${list.map(rc => { const t = recipeTotal(rc), s = perServing(rc); return `<div class="card">
    <div class="row between"><b>${rc.fav ? "★ " : ""}${esc(rc.name)}</b><span class="muted">${rc.servings} serving${rc.servings == 1 ? "" : "s"}</span></div>
    <div class="muted">Per serving: ${macroLine(s)}</div><div class="muted">Whole batch: ${r(t.kcal)} kcal</div>
    <div class="row" style="margin-top:8px"><button class="small primary" data-act="logRecipe" data-v="${rc.id}">Log</button>
    <button class="small" data-act="favRecipe" data-v="${rc.id}">${rc.fav ? "Unstar" : "★ Favorite"}</button>
    <button class="small" data-act="editRecipe" data-v="${rc.id}">Edit</button>
    <button class="small" data-act="dupRecipe" data-v="${rc.id}">Copy</button>
    <button class="small danger" data-act="delRecipe" data-v="${rc.id}">✕</button></div></div>`; }).join("")}`;
}

function viewIngredients() {
  const list = [...state.ingredients].sort((a, b) => a.name.localeCompare(b.name));
  return `<div class="row between"><h2>Ingredients</h2><button class="primary" data-act="editIng">+ New</button></div>
  <p class="muted">Values are per 100 g (or 100 ml). Ingredients you type into recipes are added here automatically — edit any of them to match your package label.</p>
  <div class="card">${list.length ? list.map(i => `<div class="item"><div><div>${esc(i.name)}</div><div class="muted">per 100g: ${macroLine(i)}</div>${i.src ? `<div class="muted">${esc(i.src)}</div>` : ""}</div>
    <div class="row"><button class="small" data-act="editIng" data-v="${i.id}">Edit</button><button class="small danger" data-act="delIng" data-v="${i.id}">✕</button></div></div>`).join("") : `<span class="muted">Nothing here yet.</span>`}</div>`;
}

function viewGoals() {
  const g = state.goals;
  return `<h2>Goals</h2><form class="card" data-form="goals">
    <label>Daily calories (kcal)</label><input name="kcal" inputmode="decimal" value="${g.kcal}">
    <label>Protein (g)</label><input name="p" inputmode="decimal" value="${g.p}">
    <label>Carbs (g)</label><input name="c" inputmode="decimal" value="${g.c}">
    <label>Fat (g)</label><input name="f" inputmode="decimal" value="${g.f}">
    <p class="muted" id="gcheck"></p><button class="primary">Save goals</button></form>
  <div class="card"><h3>Backup</h3><p class="muted">Data lives in this browser only. Export regularly.</p>
    <div class="row"><button data-act="export">Export</button><button data-act="import">Import</button></div></div>`;
}

// ---------- forms ----------
function entryDialog(meal, preRecipe) {
  const favs = state.recipes.filter(x => x.fav);
  openDlg(`<h3>Add to ${meal}</h3>
  ${favs.length ? `<div class="muted">Favorites</div><div class="chips" id="favs">${favs.map(x => `<button class="small" data-fav="${x.id}">${esc(x.name)}</button>`).join("")}</div>` : ""}
  <form id="f"><label>Type</label><select name="type"><option value="recipe">Recipe (servings)</option><option value="ingredient">Ingredient (grams)</option><option value="quick">Quick add (manual)</option></select>
  <div id="fields"></div><label>Meal</label><select name="meal">${MEALS.map(m => `<option ${m === meal ? "selected" : ""}>${m}</option>`).join("")}</select>
  <div class="row" style="margin-top:12px"><button type="button" class="grow" data-close>Cancel</button><button class="primary grow">Add</button></div></form>`, d => {
    const f = d.querySelector("#f"), fields = d.querySelector("#fields");
    const opts = (arr) => arr.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    const draw = () => {
      const t = f.type.value;
      fields.innerHTML = t === "recipe" ? (state.recipes.length ? `<label>Recipe</label><select name="ref">${opts(state.recipes)}</select><label>Servings eaten</label><input name="amt" inputmode="decimal" value="1">` : `<p class="muted">No recipes yet.</p>`)
        : t === "ingredient" ? `${foodDatalist()}<label>Food</label><input list="foods" name="food" placeholder="e.g. banana"><label>Grams</label><input name="amt" inputmode="decimal" value="100"><p class="muted" id="fst"></p>`
        : `<label>Name</label><input name="name" value="Quick add"><div class="grid"><div><label>kcal</label><input name="kcal" inputmode="decimal"></div><div><label>Protein</label><input name="p" inputmode="decimal"></div><div><label>Carbs</label><input name="c" inputmode="decimal"></div></div><label>Fat</label><input name="f" inputmode="decimal">`;
      if (preRecipe && t === "recipe" && f.ref) f.ref.value = preRecipe;
    };
    f.type.onchange = draw; draw();
    d.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => { f.type.value = "recipe"; draw(); f.ref.value = b.dataset.fav; f.amt.focus(); });
    f.onsubmit = async e => {
      e.preventDefault();
      const t = f.type.value; let e2;
      if (t === "recipe") { const rc = state.recipes.find(x => x.id === f.ref?.value); if (!rc) return; const a = num(f.amt.value) || 1; e2 = { name: rc.name, amount: `${r(a, 2)} serving${a == 1 ? "" : "s"}`, ...add(ZERO(), perServing(rc), a) }; }
      else if (t === "ingredient") {
        const q = f.food.value.trim(), st = d.querySelector("#fst"); if (!q) return;
        st.textContent = "Looking up…";
        const n = await resolveFood(q);
        if (!n) { st.textContent = "Couldn't find that — try another name or use Quick add."; return; }
        const i = ing(ensureIngredient(q, n)), g = num(f.amt.value); e2 = { name: i.name, amount: `${r(g)} g`, ...add(ZERO(), i, g / 100) };
      }
      else e2 = { name: f.name.value.trim() || "Quick add", amount: "", kcal: num(f.kcal.value), p: num(f.p.value), c: num(f.c.value), f: num(f.f.value) };
      (state.log[ui.date] ||= []).push({ id: uid(), meal: f.meal.value, ...e2 });
      save(); closeDlg(); render();
    };
  });
}

function ingDialog(id) {
  const i = id ? ing(id) : { name: "", kcal: "", p: "", c: "", f: "" };
  openDlg(`<h3>${id ? "Edit" : "New"} ingredient</h3><form id="f">${foodDatalist()}<label>Name</label>
  <div class="row"><input list="foods" name="name" value="${esc(i.name)}" class="grow" required><button type="button" id="look">Look up</button></div>
  <p class="muted" id="src">Per 100 g${i.src ? ` · ${esc(i.src)}` : " · type a name and the values fill in automatically"}</p><div class="grid"><div><label>kcal</label><input name="kcal" inputmode="decimal" value="${i.kcal}"></div>
  <div><label>Protein</label><input name="p" inputmode="decimal" value="${i.p}"></div><div><label>Carbs</label><input name="c" inputmode="decimal" value="${i.c}"></div></div>
  <label>Fat</label><input name="f" inputmode="decimal" value="${i.f}">
  <div class="row" style="margin-top:12px"><button type="button" class="grow" data-close>Cancel</button><button class="primary grow">Save</button></div></form>`, d => {
    const f = d.querySelector("#f"), src = d.querySelector("#src");
    let found = i.src || "";
    const look = async () => {
      const q = f.name.value.trim(); if (!q) return;
      src.textContent = "Looking up…";
      const got = await resolveFood(q, true);
      if (!got) { src.textContent = "Per 100 g · not found, enter the values yourself"; return; }
      ["kcal", "p", "c", "f"].forEach(k => f[k].value = got[k]);
      found = got.src; src.textContent = `Per 100 g · ${got.src} (edit if your package says otherwise)`;
    };
    d.querySelector("#look").onclick = look;
    f.name.addEventListener("change", () => { if (!f.kcal.value) look(); });
    f.onsubmit = e => {
      e.preventDefault();
      const v = { name: f.name.value.trim(), kcal: num(f.kcal.value), p: num(f.p.value), c: num(f.c.value), f: num(f.f.value), src: found || "entered manually" };
      if (id) Object.assign(i, v); else state.ingredients.push({ id: uid(), ...v });
      save(); closeDlg(); render();
    };
  });
}

function recipeDialog(id) {
  const orig = id && state.recipes.find(x => x.id === id);
  const rc = orig ? structuredClone(orig) : { id: uid(), name: "", servings: 1, fav: false, items: [] };
  // Each row: typed name, grams, resolved nutrition per 100 g (n) and a status line.
  const rows = rc.items.map(it => { const i = ing(it.ingId); return { name: i ? i.name : "", grams: it.grams, n: i || null, status: i ? (i.src || "your ingredient") : "" }; });
  if (!rows.length) rows.push({ name: "", grams: "", n: null, status: "" }, { name: "", grams: "", n: null, status: "" });
  openDlg(`<h3>${id ? "Edit" : "New"} recipe</h3><form id="f">${foodDatalist()}<label>Name</label><input name="name" value="${esc(rc.name)}" placeholder="e.g. Chili con carne" required>
  <label>Servings the batch makes</label><input name="servings" inputmode="decimal" value="${rc.servings}">
  <label>Ingredients — just type the name and grams for the whole batch</label><div id="items"></div>
  <button type="button" class="small" id="addRow" style="margin-top:6px">+ Ingredient</button>
  <div class="card" style="margin-top:12px" id="sum"></div>
  <p class="muted" id="err" style="color:var(--danger)"></p>
  <div class="row"><button type="button" class="grow" data-close>Cancel</button><button class="primary grow">Save</button></div></form>`, d => {
    const f = d.querySelector("#f"), box = d.querySelector("#items");
    const total = () => rows.reduce((t, x) => x.n ? add(t, x.n, num(x.grams) / 100) : t, ZERO());
    const sum = () => {
      const t = total(), sv = num(f.servings.value) || 1;
      d.querySelector("#sum").innerHTML = `<div class="muted">Whole batch</div>${macroLine(t)}<div class="muted" style="margin-top:6px">Per serving (1 of ${r(sv, 2)})</div><b>${macroLine(add(ZERO(), t, 1 / sv))}</b>`;
    };
    const statusHtml = x => x.status ? `<div class="muted" style="margin:-2px 0 8px">${x.n ? `${esc(x.status)} · ${r(x.n.kcal)} kcal, P ${r(x.n.p, 1)} C ${r(x.n.c, 1)} F ${r(x.n.f, 1)} per 100 g` : esc(x.status)}</div>` : "";
    const draw = () => {
      box.innerHTML = rows.map((x, k) => `<div class="row" style="margin-bottom:4px"><input list="foods" data-k="${k}" data-f="name" value="${esc(x.name)}" placeholder="e.g. beef mince" class="grow">
        <input data-k="${k}" data-f="grams" inputmode="decimal" value="${x.grams}" placeholder="g" style="width:72px"><button type="button" class="small danger" data-rm="${k}">✕</button></div><div data-st="${k}">${statusHtml(x)}</div>`).join("");
      sum();
    };
    const lookup = k => (rows[k].pending = doLookup(k));
    const doLookup = async k => {
      const x = rows[k], name = x.name.trim();
      if (!name) { x.n = null; x.status = ""; }
      else {
        x.status = "Looking up…"; x.n = null; d.querySelector(`[data-st="${k}"]`).innerHTML = statusHtml(x); sum();
        const res = await resolveFood(name);
        if (rows[k] !== x || x.name.trim() !== name) return; // edited meanwhile
        x.n = res; x.status = res ? res.src : "Not found — try another name, or add it on the Ingredients tab";
      }
      const st = d.querySelector(`[data-st="${k}"]`); if (st) st.innerHTML = statusHtml(x); sum();
    };
    box.addEventListener("input", e => { const k = e.target.dataset.k; if (k == null) return; rows[k][e.target.dataset.f] = e.target.value; if (e.target.dataset.f === "grams") sum(); });
    box.addEventListener("change", e => { const k = e.target.dataset.k; if (k != null && e.target.dataset.f === "name") lookup(+k); });
    box.onclick = e => { if (e.target.dataset.rm != null) { rows.splice(e.target.dataset.rm, 1); draw(); } };
    d.querySelector("#addRow").onclick = () => { rows.push({ name: "", grams: "", n: null, status: "" }); draw(); box.querySelector(`[data-k="${rows.length - 1}"]`).focus(); };
    f.servings.oninput = sum;
    draw();
    f.onsubmit = async e => {
      e.preventDefault();
      const err = d.querySelector("#err"), used = rows.filter(x => x.name.trim());
      // Resolve anything typed but not looked up yet (e.g. Save pressed straight after typing).
      err.textContent = "";
      used.forEach(x => { if (!x.n && !x.pending) lookup(rows.indexOf(x)); });
      await Promise.all(used.map(x => x.pending));
      const missing = used.filter(x => !x.n).map(x => x.name.trim());
      if (missing.length) { err.textContent = `Couldn't find: ${missing.join(", ")}. Change the name or add it on the Ingredients tab.`; return; }
      if (!used.length) { err.textContent = "Add at least one ingredient."; return; }
      rc.name = f.name.value.trim(); rc.servings = num(f.servings.value) || 1;
      rc.items = used.map(x => ({ ingId: ensureIngredient(x.name, x.n), grams: num(x.grams) }));
      const k = state.recipes.findIndex(x => x.id === rc.id);
      if (k >= 0) state.recipes[k] = rc; else state.recipes.push(rc);
      save(); closeDlg(); render();
    };
  });
}

// ---------- events ----------
const actions = {
  tab: v => { ui.tab = v; },
  date: v => { ui.date = v; },
  addEntry: v => entryDialog(v),
  logRecipe: v => { ui.tab = "today"; entryDialog("Lunch", v); },
  delEntry: v => { state.log[ui.date] = dayEntries(ui.date).filter(e => e.id !== v); save(); },
  editIng: v => ingDialog(v),
  delIng: async v => {
    const used = state.recipes.filter(rc => rc.items.some(it => it.ingId === v)).map(rc => rc.name);
    if (!await ask(used.length ? `Used in: ${used.join(", ")}. Delete anyway? It will count as 0 in those recipes.` : "Delete this ingredient?")) return;
    state.ingredients = state.ingredients.filter(i => i.id !== v); save(); render();
  },
  editRecipe: v => recipeDialog(v),
  favRecipe: v => { const rc = state.recipes.find(x => x.id === v); rc.fav = !rc.fav; save(); },
  dupRecipe: v => { const rc = structuredClone(state.recipes.find(x => x.id === v)); rc.id = uid(); rc.name += " (copy)"; rc.fav = false; state.recipes.push(rc); save(); },
  delRecipe: async v => { if (await ask("Delete this recipe? Days you already logged keep their numbers.")) { state.recipes = state.recipes.filter(x => x.id !== v); save(); render(); } },
  export: async () => {
    // Backup includes every logged day, so fetch the ones not loaded yet.
    if (db) try { (await db.collection("days").limit(1000).get()).docs.forEach(x => { if (!loadedDays.has(x.id)) { state.log[x.id] = structuredClone(x.data().entries || []); loadedDays.add(x.id); synced["days/" + x.id] = JSON.stringify({ entries: state.log[x.id] }); } }); } catch {}
    const data = JSON.stringify(state, null, 2), filename = `calorie-backup-${today()}.json`;
    const dl = window.claude?.use ? await claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename, data }); } catch (e) { if (e.code !== "declined") notice("The backup couldn't be saved here."); } return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; a.click();
  },
  import: () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = async () => {
      let d;
      try { d = JSON.parse(await inp.files[0].text()); if (!Array.isArray(d.ingredients) || !Array.isArray(d.recipes) || typeof d.log !== "object") throw 0; }
      catch { notice("That file isn't a backup from this app."); return; }
      if (!await ask("Replace your ingredients, recipes and goals with this backup? Days in the backup replace the same days here.", "Replace")) return;
      state = { goals: d.goals || state.goals, ingredients: d.ingredients, recipes: d.recipes, log: { ...state.log, ...d.log } };
      Object.keys(d.log).forEach(x => loadedDays.add(x)); save(); render();
    };
    inp.click();
  },
};

document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeDlg();
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  if (el.dataset.act === "date") return goToDate(el.dataset.v);
  actions[el.dataset.act](el.dataset.v);
  if (!dlg.open) render();
});
document.addEventListener("change", e => {
  if (e.target.dataset.act === "pickDate" && e.target.value) goToDate(e.target.value);
});
document.addEventListener("input", e => {
  const f = e.target.closest("[data-form=goals]"); if (!f) return;
  const kcalFromMacros = num(f.p.value) * 4 + num(f.c.value) * 4 + num(f.f.value) * 9;
  document.getElementById("gcheck").textContent = `Macros add up to ${r(kcalFromMacros)} kcal (protein 4, carbs 4, fat 9 per gram).`;
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form=goals]"); if (!f) return;
  e.preventDefault();
  state.goals = { kcal: num(f.kcal.value), p: num(f.p.value), c: num(f.c.value), f: num(f.f.value) };
  save(); ui.tab = "today"; render();
});

render();
connect();
</script>
